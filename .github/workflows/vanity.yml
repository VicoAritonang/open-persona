name: Deploy go.vicoworks.com

# Deploys the Cloudflare Worker that makes `go get go.vicoworks.com/...` work.
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the vicoworks.com zone

on:
  push:
    branches: [main]
    paths:
      - deploy/vanity/**
      - .github/workflows/vanity.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vanity-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/vanity
          command: deploy

      - name: Check that go can resolve the module
        run: |
          sleep 15
          curl -fsS "https://go.vicoworks.com/openpersona?go-get=1" | tee /dev/stderr | grep -q 'name="go-import"'
