name: Release

# Push a tag like v0.2.0 to publish a library version (docs/RELEASING.md).
# Go modules are published by the tag itself; this workflow tests it,
# attaches CLI binaries to a GitHub release whose notes are the tag's
# CHANGELOG.md section, and asks the Go module proxy to index the version.
# Platform tags (platform/v*) do not match.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test -race ./...

      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            /^\[[^]]+\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version"; exit 1
          fi

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/openpersona-${GITHUB_REF_NAME}-${os}-${arch}${ext}" ./cmd/openpersona
          done
          (cd dist && sha256sum * > checksums.txt)

      # Idempotent: a tag pushed again (after a history rewrite, or a re-run)
      # updates the existing release instead of failing on it.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            prerelease=""
            case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease
          fi

      # Not fatal: the proxy also picks the version up on the first `go get`.
      - name: Ask the Go proxy to index this version
        continue-on-error: true
        run: curl -fsS "https://proxy.golang.org/go.vicoworks.com/open-persona/@v/${GITHUB_REF_NAME}.info"
