name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi

      - name: Module is tidy
        if: matrix.os == 'ubuntu-latest'
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      # Tests use a fake LLM: no API keys, no network, no cost.
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: go test ./...

      - name: Test (race detector)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      # The library promises a cgo-free build; keep it that way.
      - name: Build without cgo
        if: matrix.os == 'ubuntu-latest'
        run: CGO_ENABLED=0 go build ./...
