# Code generation: `make generate`. The plugins run through `go tool`, so
# their versions are the tool lines pinned in go.mod: generated code always
# matches the runtime library it compiles against.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: go.vicoworks.com/open-persona/api/gen
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: api/gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: api/gen
    opt: paths=source_relative
